<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Budgets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">Finance Tracker</div>

        <div class="nav-right">
            <span>Welcome, {{ username }}</span>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('transactions_page') }}">Transactions</a>
            <a href="{{ url_for('budgets_page') }}" class="active">Monthly Budgets</a>
            <a href="{{ url_for('logout') }}" class="logout-button">Logout</a>
        </div>
    </nav>

    <main class="dashboard-container">

        <h1>Monthly Budgets</h1>

        <section class="dashboard-section">

            <h2>Set a Monthly Budget</h2>

            <form id="budget-form">

                <div class="form-group">
                    <label for="budget-month">Month</label>
                    <input type="month" id="budget-month" required>
                </div>

                <div class="form-group">
                    <label for="budget-category">Category</label>
                    <select id="budget-category" required>
                        <option value="Food">Food</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget-amount">Budget Amount ($)</label>
                    <input
                        type="number"
                        id="budget-amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit" id="budget-submit">
                    Save Budget
                </button>

                <p id="budget-message"></p>

            </form>

        </section>

        <section class="dashboard-section">

            <h2>Budget Overview</h2>

            <div class="form-group">
                <label for="view-month">View Month</label>
                <input type="month" id="view-month">
            </div>

            <div class="table-container">
                <table id="budget-table">

                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Budget</th>
                            <th>Spent</th>
                            <th>Remaining</th>
                            <th>Used</th>
                        </tr>
                    </thead>

                    <tbody id="budget-list">
                        <tr>
                            <td colspan="5">Loading budgets...</td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='budgets.js') }}"></script>

</body>
</html>
