<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">Finance Tracker</div>

        <div class="nav-right">
            <span>Welcome, {{ username }}</span>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('transactions_page') }}" class="active">Transactions</a>
            <a href="{{ url_for('budgets_page') }}">Monthly Budgets</a>
            <a href="{{ url_for('logout') }}" class="logout-button">Logout</a>
        </div>
    </nav>

    <main class="dashboard-container">

        <h1>Transactions</h1>

        <section class="dashboard-section">

            <h2 id="form-title">Add Transaction</h2>

            <form id="transaction-form">

                <input type="hidden" id="transaction-id">

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="Enter a description"
                    >
                </div>

                <button type="submit" id="submit-button">
                    Add Transaction
                </button>

                <button type="button" id="cancel-button" style="display: none;">
                    Cancel
                </button>

                <p id="transaction-message"></p>

            </form>

        </section>

        <section class="dashboard-section">

            <h2>Transaction History</h2>

            <div class="transaction-filters">

                <div class="form-group">
                    <label for="filter-category">Category</label>
                    <select id="filter-category">
                        <option value="">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="filter-start-date">Start Date</label>
                    <input type="date" id="filter-start-date">
                </div>

                <div class="form-group">
                    <label for="filter-end-date">End Date</label>
                    <input type="date" id="filter-end-date">
                </div>

                <button type="button" id="apply-filters">
                    Apply Filters
                </button>

                <button type="button" id="clear-filters">
                    Clear Filters
                </button>

            </div>

            <div class="table-container">
                <table id="transaction-table">

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="transaction-list">
                        <tr>
                            <td colspan="6">Loading transactions...</td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='transactions.js') }}"></script>

</body>
</html>
